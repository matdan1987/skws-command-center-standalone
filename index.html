<!doctype html>
<html lang="de">
<head>

<div class="app">

 <div class="workspace">WORKSPACE <span class="safe">● STANDALONE DEMO</span></div>

 <header class="topbar"><div class="crumb">SKYWALKERS <span>/</span> <strong id="place">ÜBERSICHT</strong></div><div class="topright"><span class="tag">SERVER 1858</span><span class="avatar">S</span></div></header>

 <footer>SKWS COMMAND CENTER <span>Eigenständiges GitHub Pages & Supabase · Online-Meldungen mit Freigabe</span></footer>
</div>
</div>
